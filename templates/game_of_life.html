<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Conway's Game of Life</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: #eee;
    font-family: monospace, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; }
  canvas { border: 2px solid #888; background: #eee; }
  a.home-link { color: #9cf; margin-bottom: 20px; }
  #controls { margin-top: 10px; }
  #controls button {
    font-size: 16px;
    padding: 8px 16px;
    margin: 0 6px;
    cursor: pointer;
  }
</style>
</head>
<body>
<a class="home-link" href="{{ url_for('home') }}">&larr; Tilbage til forsiden</a>
<h1>Conway's Game of Life <span id="generation">(generation 0)</span></h1>

<canvas id="canvas" width="{{ cols * cell_size }}" height="{{ rows * cell_size }}"></canvas>

<div id="controls">
  <button id="pauseBtn">Pause</button>
  <button id="restartBtn">Ny tilfældig start</button>
</div>

<script>
  const ROWS = {{ rows }};
  const COLS = {{ cols }};
  const CELL_SIZE = {{ cell_size }};
  const DELAY_MS = {{ delay_ms }};
  const ALIVE_COLOR = '#111';
  const DEAD_COLOR = '#eee';

  let board = {{ board | tojson }};
  let generation = 0;
  let running = true;

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const generationLabel = document.getElementById('generation');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');

  function draw() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        ctx.fillStyle = board[r][c] ? ALIVE_COLOR : DEAD_COLOR;
        ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      }
    }
    generationLabel.textContent = '(generation ' + generation + ')';
  }

  async function tick() {
    if (!running) return;
    const res = await fetch('{{ url_for("game_of_life.game_of_life_step") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ board }),
    });
    const data = await res.json();
    board = data.board;
    generation++;
    draw();
    setTimeout(tick, DELAY_MS);
  }

  pauseBtn.addEventListener('click', () => {
    running = !running;
    pauseBtn.textContent = running ? 'Pause' : 'Fortsæt';
    if (running) tick();
  });

  restartBtn.addEventListener('click', async () => {
    const res = await fetch('{{ url_for("game_of_life.game_of_life_random") }}');
    const data = await res.json();
    board = data.board;
    generation = 0;
    draw();
  });

  draw();
  setTimeout(tick, DELAY_MS);
</script>
</body>
</html>
