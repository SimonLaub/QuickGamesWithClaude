<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Spilportal</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: #eee;
    font-family: monospace, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 { margin-bottom: 30px; }
  .choices { display: flex; gap: 20px; margin: 40px 0; }
  a.choice {
    display: block;
    font-size: 20px;
    padding: 20px 30px;
    background: #333;
    color: #eee;
    text-decoration: none;
    border: 2px solid #555;
    border-radius: 8px;
    text-align: center;
  }
  a.choice:hover { background: #444; border-color: #888; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: 1100px;
    width: 100%;
  }
  .gallery figure {
    margin: 0;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 8px;
    overflow: hidden;
  }
  .gallery img {
    display: block;
    width: 100%;
    height: 180px;
    object-fit: cover;
  }
  .gallery figcaption {
    padding: 8px 10px;
    font-size: 13px;
    color: #aaa;
    text-align: center;
  }

  @media (max-width: 700px) {
    .gallery { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<h1>Vælg spilkategori</h1>

<div class="gallery">
  <figure>
    <img src="{{ url_for('static', filename='images/students-1.jpg') }}" alt="Studerende der samarbejder udenfor">
    <figcaption>Studiegruppe i sving</figcaption>
  </figure>
  <figure>
    <img src="{{ url_for('static', filename='images/students-2.jpg') }}" alt="Studerende der læser i klasseværelset">
    <figcaption>Dybt koncentreret</figcaption>
  </figure>
  <figure>
    <img src="{{ url_for('static', filename='images/students-3.jpg') }}" alt="Studerende der læser ved skrivebordet">
    <figcaption>Fordybelse ved skrivebordet</figcaption>
  </figure>
</div>

<div class="choices">
  <a class="choice" href="{{ url_for('game_of_life.game_of_life') }}">Python spil<br><small>Conway's Game of Life</small></a>
  <a class="choice" href="{{ url_for('js_games') }}">JavaScript spil<br><small>Space Invaders, Snake, Memory</small></a>
</div>

<div class="gallery">
  <figure>
    <img src="{{ url_for('static', filename='images/students-4.jpg') }}" alt="Spillere med controllere">
    <figcaption>Game on</figcaption>
  </figure>
  <figure>
    <img src="{{ url_for('static', filename='images/students-5.jpg') }}" alt="Studerende der samarbejder om en laptop">
    <figcaption>Sammen om opgaven</figcaption>
  </figure>
  <figure>
    <img src="{{ url_for('static', filename='images/students-6.jpg') }}" alt="Studerende der arbejder sammen udenfor med laptop">
    <figcaption>Gruppearbejde udenfor</figcaption>
  </figure>
</div>
</body>
</html>
